<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<link rel="stylesheet" href="drawbar.css">
<title>CapturePro drawing tools</title></head>
<body>
  <div class="bar">
    <span class="grip" title="Drag to move"></span>
    <div id="tools" class="group"></div>
    <span class="sep"></span>
    <div id="colors" class="group"></div>
    <input id="width" type="range" min="1" max="12" value="4" title="Line width">
    <span class="sep"></span>
    <button id="whiteboard" title="Whiteboard (W)"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="10" rx="1"/><path d="M7 17l3-3 3 3"/></svg></button>
    <button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 010 10h-2"/></svg></button>
    <button id="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 000 10h2"/></svg></button>
    <button id="clear" title="Clear all (Del)"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></button>
    <span id="hint" class="hint"></span>
    <button id="close" class="close" title="Exit drawing mode (Esc)"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <script src="drawbar.js"></script>
</body></html>
